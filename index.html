<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#162033" />
  <title>Mapa do Festival</title>
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/map.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="header-main">
        <div>
          <p class="eyebrow">Mapa Interativo</p>
          <h1>Festival Sesc in Shock</h1>
        </div>
        <div class="header-actions">
          <button id="debugToggle" class="debug-toggle" type="button" aria-pressed="false">Debug</button>
          <button id="resetViewButton" class="icon-button" type="button" aria-label="Restaurar mapa">↺</button>
        </div>
      </div>
      <section id="debugPanel" class="debug-panel" hidden>
        <div class="debug-heading">
          <h2>Inserir ponto de interesse</h2>
          <button id="debugCollapse" type="button" aria-expanded="true">Recolher</button>
        </div>
        <label>Nome<input id="debugName" type="text" placeholder="Nome do ponto de interesse" /></label>
        <div id="debugTypeList" class="debug-type-list" aria-label="Tipos de ponto de interesse"></div>
        <p class="debug-hint">Arraste um tipo até o mapa para criar.</p>
        <label>Ponto selecionado<select id="debugAttractionList"></select></label>
        <label>Área do ponto<select id="debugPointArea"></select></label>
        <div class="debug-actions">
          <button id="debugDelete" type="button">Excluir</button>
        </div>
        <details class="debug-area-editor">
          <summary>Editar áreas</summary>
          <label>Área<select id="debugAreaList"></select></label>
          <label>Nome<input id="debugAreaName" type="text" /></label>
          <div class="debug-editor-fields">
            <label>X<input id="debugAreaX" type="number" step="1" /></label>
            <label>Y<input id="debugAreaY" type="number" step="1" /></label>
            <label>Largura<input id="debugAreaWidth" type="number" min="80" step="1" /></label>
            <label>Altura<input id="debugAreaHeight" type="number" min="80" step="1" /></label>
          </div>
        </details>
        <details class="debug-floor-editor">
          <summary>Planta baixa opcional</summary>
          <label>Imagem<input id="debugFloorFile" type="file" accept="image/*" /></label>
          <div class="debug-editor-fields">
            <label>X<input id="debugFloorX" type="number" step="1" value="0" /></label>
            <label>Y<input id="debugFloorY" type="number" step="1" value="0" /></label>
            <label>Escala<input id="debugFloorScale" type="number" min="0.1" step="0.1" value="1" /></label>
            <label>Opacidade<input id="debugFloorOpacity" type="number" min="0" max="1" step="0.05" value="0.5" /></label>
          </div>
          <button id="debugFloorRemove" type="button">Remover planta</button>
        </details>
        <details class="debug-mesh-editor">
          <summary>Editar malha de circulação</summary>
          <label>Você está aqui<select id="debugOriginNode"></select></label>
          <label>Conexão<select id="debugConnectionList"></select></label>
          <div class="debug-editor-fields">
            <label>Origem<select id="debugConnectionFrom"></select></label>
            <label>Destino<select id="debugConnectionTo"></select></label>
            <label>Tipo<select id="debugConnectionType"><option value="main-path">main-path</option><option value="corridor">corridor</option><option value="ramp">ramp</option><option value="stairs">stairs</option><option value="building-access">building-access</option></select></label>
            <label>Controle X<input id="debugControlX" type="number" step="1" /></label>
            <label>Controle Y<input id="debugControlY" type="number" step="1" /></label>
          </div>
          <button id="debugCopyMesh" type="button">Copiar malha</button>
        </details>
        <p id="debugStatus" class="debug-status" aria-live="polite"></p>
      </section>
    </header>

    <section class="search-panel" aria-label="Busca e filtros">
      <label class="search-box">
        <span aria-hidden="true">⌕</span>
        <input id="searchInput" type="search" placeholder="Buscar ponto de interesse" autocomplete="off" />
      </label>
      <div id="filterList" class="filter-list" role="list"></div>
    </section>

    <main class="map-section">
      <div id="mapViewport" class="map-viewport" aria-label="Mapa do festival">
        <div id="mapStage" class="map-stage">
          <object id="festivalMap" class="map-svg" data="assets/maps/festival-map.svg" type="image/svg+xml" aria-label="Mapa vetorial do festival"></object>
        </div>
      </div>

      <div class="map-controls" aria-label="Controles do mapa">
        <button id="zoomInButton" type="button" aria-label="Aumentar zoom">+</button>
        <button id="zoomOutButton" type="button" aria-label="Diminuir zoom">−</button>
        <button id="clearRouteButton" class="clear-route-button" type="button">Limpar rota</button>
      </div>

      <p id="mapStatus" class="map-status" aria-live="polite">Toque em um ponto de interesse para ver detalhes.</p>
    </main>

    <aside id="detailSheet" class="detail-sheet" aria-hidden="true">
      <div class="sheet-handle" aria-hidden="true"></div>
      <button id="closeSheetButton" class="sheet-close" type="button" aria-label="Fechar detalhes">×</button>
      <p id="detailCategory" class="detail-category"></p>
      <h2 id="detailTitle"></h2>
      <p id="detailDescription"></p>
      <dl class="detail-meta">
        <div><dt>Acessibilidade</dt><dd id="detailAccessibility"></dd></div>
        <div><dt>Horário</dt><dd id="detailSchedule"></dd></div>
      </dl>
      <button id="routeButton" class="primary-button" type="button">Como chegar</button>
    </aside>

  </div>

  <footer class="app-version" id="app-version"></footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
