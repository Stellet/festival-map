<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1100" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title description">
  <title id="title">Mapa fictício do Festival Horizonte</title>
  <desc id="description">Mapa vetorial com atrações e malha de circulação navegável.</desc>
  <style>
    [class^="circulation-"], .street-floor, .street-line, .corridor-floor, .corridor-line { fill: none; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
    .circulation-main-path-floor, .circulation-main-floor, .street-floor { stroke: #0b0d12; stroke-width: 42; }
    .circulation-main-path-line, .circulation-main-line, .street-line { stroke: #596174; stroke-width: 17; }
    .circulation-ramp-floor { stroke: #10131a; stroke-width: 30; }
    .circulation-ramp-line { stroke: #596174; stroke-width: 11; }
    .circulation-corridor-floor, .circulation-stairs-floor, .circulation-building-access-floor, .corridor-floor { stroke: #10131a; stroke-width: 22; }
    .circulation-corridor-line, .circulation-stairs-line, .circulation-building-access-line, .corridor-line { stroke: #454c5e; stroke-width: 7; }
    .circulation-stairs-steps { fill: none; stroke: #a8afc3; stroke-width: 4; stroke-linecap: square; pointer-events: none; }
    .attraction { cursor: pointer; transition: opacity .15s ease; }
    .attraction:hover { opacity: .85; }
    .attraction-label { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 20px; font-weight: 700; fill: #f5f7ff; stroke: #181b24; stroke-width: 4; paint-order: stroke; text-anchor: middle; pointer-events: none; user-select: none; }
    .attraction-hit-area { fill: transparent; pointer-events: all; cursor: pointer; }
    .attraction-marker { stroke: #ffffff; stroke-width: 4; cursor: pointer; }
    .attraction-icon { font-family: Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #ffffff; text-anchor: middle; dominant-baseline: central; pointer-events: none; user-select: none; }
    .selected .attraction-marker { stroke: #22d3ee; stroke-width: 8; }
    .debug-selected .attraction-marker { stroke: #facc15; stroke-width: 9; }
    .debug-dragging { opacity: .72; }
    .hidden { display: none; }
    #active-route { fill: none; stroke: #ffffff; stroke-width: 13; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 7px #22d3ee); pointer-events: none; }
    #route-origin-marker { fill: #22d3ee; stroke: #ffffff; stroke-width: 5; pointer-events: none; }
    #route-destination-marker { fill: #fb7185; stroke: #ffffff; stroke-width: 5; pointer-events: none; }
    #navigation-debug { display: none; pointer-events: none; }
    #navigation-debug.is-visible { display: block; }
    #navigation-debug path { fill: none; stroke: #f5f7ff; stroke-width: 7; stroke-dasharray: 8 7; opacity: .6; pointer-events: stroke; cursor: pointer; }
    #navigation-debug path.is-selected { stroke: #fb7185; stroke-width: 11; opacity: 1; }
    #navigation-debug circle { stroke: #0f1117; stroke-width: 3; pointer-events: all; cursor: crosshair; }
    #navigation-debug [data-navigation-node-id] { fill: #facc15; }
    #navigation-debug [data-navigation-control-id] { fill: #22d3ee; }
    svg, #map-content, #map-content * { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    svg { cursor: grab; }
    svg.is-dragging { cursor: grabbing; }
    text { pointer-events: none; }
  </style>
  <g id="map-content" transform="translate(0 0) scale(1)">
    <rect width="760" height="1100" fill="#0f1117" />
    <rect x="35" y="35" width="690" height="1030" rx="42" fill="#181b24" stroke="#34394a" stroke-width="10" />
  </g>
</svg>
