<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#162033" />
  <title>Mapa do Festival</title>
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/map.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="header-main">
        <div>
          <p class="eyebrow">Festival Sesc in Shock</p>
          <h1>Mapa interativo</h1>
        </div>
        <div class="header-actions">
          <button id="debugToggle" class="debug-toggle" type="button" aria-pressed="false">Debug</button>
          <button id="resetViewButton" class="icon-button" type="button" aria-label="Restaurar mapa">↺</button>
        </div>
      </div>
      <section id="debugPanel" class="debug-panel" hidden>
        <div class="debug-heading">
          <h2>Debug de posições</h2>
          <div><button id="debugCollapse" type="button" aria-expanded="true">Recolher</button><button id="debugNew" type="button">Nova atração</button></div>
        </div>
        <label>Você está aqui<select id="debugOriginNode"></select></label>
        <label>Atração<select id="debugAttractionList"></select></label>
        <div class="debug-editor-fields">
          <label>Nome<input id="debugName" type="text" /></label>
          <label>Descrição<input id="debugDescription" type="text" /></label>
          <label>Ícone
            <select id="debugIcon">
              <option value="★">★ Palco</option><option value="F">F Alimentação</option>
              <option value="WC">WC Banheiro</option><option value="+">+ Médico</option>
              <option value="◆">◆ Atividade</option><option value="E">E Entrada</option><option value="S">S Saída</option>
              <option value="●">● Localização</option>
            </select>
          </label>
          <label>Nó de navegação<select id="debugNavigationNode"></select></label>
        </div>
        <div class="debug-coordinates">
          <label>X<input id="debugX" type="number" step="1" /></label>
          <label>Y<input id="debugY" type="number" step="1" /></label>
        </div>
        <div class="debug-actions">
          <button id="debugAdd" type="button">Adicionar</button>
          <button id="debugDelete" type="button">Excluir</button>
          <button id="debugCenter" type="button">Centralizar</button>
          <button id="debugCopy" type="button">Copiar posições</button>
          <button id="debugRestore" type="button">Restaurar posições</button>
        </div>
        <p id="debugStatus" class="debug-status" aria-live="polite"></p>
      </section>
    </header>

    <section class="search-panel" aria-label="Busca e filtros">
      <label class="search-box">
        <span aria-hidden="true">⌕</span>
        <input id="searchInput" type="search" placeholder="Buscar atração ou serviço" autocomplete="off" />
      </label>
      <div id="filterList" class="filter-list" role="list"></div>
    </section>

    <main class="map-section">
      <div id="mapViewport" class="map-viewport" aria-label="Mapa do festival">
        <div id="mapStage" class="map-stage">
          <object id="festivalMap" class="map-svg" data="assets/maps/festival-map.svg" type="image/svg+xml" aria-label="Mapa vetorial do festival"></object>
        </div>
      </div>

      <div class="map-controls" aria-label="Controles do mapa">
        <button id="zoomInButton" type="button" aria-label="Aumentar zoom">+</button>
        <button id="zoomOutButton" type="button" aria-label="Diminuir zoom">−</button>
        <button id="clearRouteButton" class="clear-route-button" type="button">Limpar rota</button>
      </div>

      <p id="mapStatus" class="map-status" aria-live="polite">Toque em uma atração para ver detalhes.</p>
    </main>

    <aside id="detailSheet" class="detail-sheet" aria-hidden="true">
      <div class="sheet-handle" aria-hidden="true"></div>
      <button id="closeSheetButton" class="sheet-close" type="button" aria-label="Fechar detalhes">×</button>
      <p id="detailCategory" class="detail-category"></p>
      <h2 id="detailTitle"></h2>
      <p id="detailDescription"></p>
      <dl class="detail-meta">
        <div><dt>Acessibilidade</dt><dd id="detailAccessibility"></dd></div>
        <div><dt>Horário</dt><dd id="detailSchedule"></dd></div>
      </dl>
      <button id="routeButton" class="primary-button" type="button">Como chegar</button>
    </aside>

  </div>

  <footer class="app-version" id="app-version"></footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
